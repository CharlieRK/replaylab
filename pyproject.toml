[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "replaylab"
version = "0.1.0.dev1"
description = "Deterministic synthetic quote events for a recoverable replay pipeline"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
replaylab = "replaylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
